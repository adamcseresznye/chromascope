[package]
name = "chromascope"
version = "0.3.0"
default-run = "chromascope"
authors = ["Adam Cseresznye"]
edition = "2021"
license = "GPL-3.0-only"
include = ["LICENSE", "**/*.rs", "Cargo.toml", "assets/icon.png", "assets/fonts/**", "presets/**", "README.md", "docs/**", "examples/**"]
rust-version = "1.88"

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio", "dep:base64"]

[[bin]]
name = "chromascope-mcp"
path = "src/bin/chromascope-mcp.rs"
required-features = ["mcp"]

[lib]
name = "chromascope"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
base64 = { version = "0.22", optional = true }
rmcp = { version = "3.5.1", features = ["transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
egui = "0.33.3"
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          
    "x11",     
    "wayland",  
] }
log = "0.4"
mzdata = "0.63"
rayon = "1.10"
libz-sys = "1.1.3"
thiserror = "1.0"
rfd = "0.14.1"
egui_plot = "0.34.1"
image = { version = "0.25.2", default-features = false, features = ["png"] }
env_logger = "0.10"
tempfile = "3"


[profile.release]
opt-level = 'z'             # Optimize for size
lto = true                  # Enable link-time optimization
codegen-units = 1           # Reduce number of codegen units to increase optimizations
panic = 'abort'             # Abort on panic
strip = true                # Strip symbols from binary*
overflow-checks = false     # removes overflow check code
debug = false               # ensure no debug info leaks through 

[dev-dependencies]
approx = "0.5"

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
