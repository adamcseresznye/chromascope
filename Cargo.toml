[package]
name = "chromascope"
version = "0.3.0"
default-run = "chromascope"
authors = ["Adam Cseresznye"]
edition = "2021"
license = "GPL-3.0-only"
description = "LC-MS chromatogram and spectrum viewer with peak integration, calibration-based quantification, QC and MCP servers for AI clients"
repository = "https://github.com/adamcseresznye/chromascope"
homepage = "https://github.com/adamcseresznye/chromascope"
readme = "README.md"
keywords = ["mass-spectrometry", "lc-ms", "chromatography", "mzml", "mcp"]
categories = ["science", "visualization"]
include = ["LICENSE", "**/*.rs", "src/adapters/*.py", "Cargo.toml", "assets/icon.png", "assets/fonts/**", "presets/**", "README.md", "THIRD_PARTY_LICENSES.txt", "docs/**", "examples/**"]
rust-version = "1.88"

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:rfd", "dep:egui_plot", "dep:image"]
mcp-headless = ["dep:rmcp", "dep:tokio"]
mcp = ["gui", "dep:rmcp", "dep:tokio", "dep:base64"]
# Unverified workflows (Identification, Untargeted analysis, Statistics). The code is always
# compiled; this flag only exposes it in the GUI, MCP and CLI.
experimental = []

[[bin]]
name = "chromascope"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "chromascope-mcp"
path = "src/bin/chromascope-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "chromascope-engine-mcp"
path = "src/bin/chromascope-engine-mcp.rs"
required-features = ["mcp-headless"]

[lib]
name = "chromascope"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

# Debian/Ubuntu package, built by the release workflow with `cargo deb --no-build`.
[package.metadata.deb]
copyright = "Adam Cseresznye"
license-file = ["LICENSE", "0"]
extended-description = "Chromascope inspects LC-MS chromatograms and spectra, integrates peaks and quantifies with calibration curves. Includes the command-line interface and the MCP servers for AI clients."
section = "science"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/chromascope", "usr/bin/", "755"],
    ["target/release/chromascope-cli", "usr/bin/", "755"],
    ["target/release/chromascope-mcp", "usr/bin/", "755"],
    ["target/release/chromascope-engine-mcp", "usr/bin/", "755"],
    ["packaging/linux/chromascope.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/chromascope-512.png", "usr/share/icons/hicolor/512x512/apps/chromascope.png", "644"],
    ["README.md", "usr/share/doc/chromascope/README.md", "644"],
    ["THIRD_PARTY_LICENSES.txt", "usr/share/doc/chromascope/THIRD_PARTY_LICENSES.txt", "644"],
]

# RPM package, built by the release workflow with `cargo generate-rpm`.
[package.metadata.generate-rpm]
summary = "LC-MS chromatogram and spectrum viewer with quantification"
assets = [
    { source = "target/release/chromascope", dest = "/usr/bin/chromascope", mode = "755" },
    { source = "target/release/chromascope-cli", dest = "/usr/bin/chromascope-cli", mode = "755" },
    { source = "target/release/chromascope-mcp", dest = "/usr/bin/chromascope-mcp", mode = "755" },
    { source = "target/release/chromascope-engine-mcp", dest = "/usr/bin/chromascope-engine-mcp", mode = "755" },
    { source = "packaging/linux/chromascope.desktop", dest = "/usr/share/applications/chromascope.desktop", mode = "644" },
    { source = "packaging/icons/chromascope-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/chromascope.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/chromascope/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/chromascope/LICENSE", mode = "644", license = true },
    { source = "THIRD_PARTY_LICENSES.txt", dest = "/usr/share/licenses/chromascope/THIRD_PARTY_LICENSES.txt", mode = "644", license = true },
]

[dependencies]
ctrlc = "3.5"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = { version = "0.22", optional = true }
rmcp = { version = "3.5.1", features = ["transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
egui = { version = "0.33.3", optional = true }
eframe = { optional = true, version = "0.33.3", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "accesskit",     # Native semantic control tree and keyboard focus.
    "glow",          
    "x11",     
    "wayland",  
] }
log = "0.4"
mzdata = "0.63"
quick-xml = "0.30"
flate2 = "1"
mzsignal = { version = ">=1.1.5,<1.2.0", default-features = false, features = ["nalgebra"] }
rayon = "1.10"
libz-sys = "1.1.3"
thiserror = "1.0"
rfd = { version = "0.14.1", optional = true }
egui_plot = { version = "0.34.1", optional = true }
image = { optional = true, version = "0.25.2", default-features = false, features = ["png"] }
env_logger = "0.10"
tempfile = "3"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }


[profile.release]
opt-level = 'z'             # Optimize for size
lto = true                  # Enable link-time optimization
codegen-units = 1           # Reduce number of codegen units to increase optimizations
panic = 'unwind'            # Allow scheduler catch_unwind to report failed jobs
strip = true                # Strip symbols from binary*
overflow-checks = false     # removes overflow check code
debug = false               # ensure no debug info leaks through 

[dev-dependencies]
approx = "0.5"
base64 = "0.22"

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
