name: Website

# Builds the website (MkDocs Material) on every push to main, every pull request and on request.
# Pull requests only check that it builds (strict: a broken link fails); main also deploys it to
# https://chromascope-ms.github.io/chromascope/. Repository setting needed once:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r website/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict -f website/mkdocs.yml

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
