name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The tests start the desktop program; it must not look for updates on the internet.
  CHROMASCOPE_NO_UPDATE_CHECK: "1"

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up scientific reference Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned statistics and reference dependencies
        run: python -m pip install numpy==2.3.3 scipy==1.16.2 mpmath==1.3.0 black==25.9.0

      - name: Check release example formatting and Python compilation
        run: |
          python -m black --check examples/release_workflows.py
          python -m py_compile examples/release_workflows.py

      # Clippy and tests compile the project; a separate cargo check duplicates that work.
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Lint default build (experimental workflows hidden)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test default build (experimental workflows hidden)
        run: cargo test --locked

      - name: Verify GUI-free MCP and CLI tests
        run: cargo test --locked --no-default-features --features mcp-headless

      - name: Build all executable interfaces
        run: cargo build --locked --all-features --bins

      - name: Regenerate independent scientific references
        # The script refuses to reuse a directory, and the cached target/ may still hold one.
        run: |
          rm -rf target/ci-reference-verification
          python tests/reference/verify_references.py target/ci-reference-verification

  # The Linux job above covers the hosted-runner basics; these legs catch platform-specific
  # failures (path handling, file locking, Apple/Windows toolchains) before a release does.
  platforms:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Python (used by the example-script tests)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Same pins as the Linux job: the statistics tests call the local NumPy/SciPy runtime.
      - name: Install pinned statistics dependencies
        run: python -m pip install numpy==2.3.3 scipy==1.16.2

      - name: Test default build
        run: cargo test --locked

      - name: Test GUI-free MCP and CLI
        run: cargo test --locked --no-default-features --features mcp-headless

  # `rust-version` in Cargo.toml is a promise to users who build from source; only a compile on
  # that exact toolchain keeps it true. tests/release_packaging.rs checks the two numbers agree.
  msrv:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compile every target with all features
        run: cargo check --locked --all-targets --all-features
