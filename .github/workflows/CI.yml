name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up scientific reference Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned statistics and reference dependencies
        run: python -m pip install numpy==2.3.3 scipy==1.16.2 mpmath==1.3.0 black==25.9.0

      - name: Check release example formatting and Python compilation
        run: |
          python -m black --check examples/release_workflows.py
          python -m py_compile examples/release_workflows.py

      # Clippy and tests compile the project; a separate cargo check duplicates that work.
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Verify GUI-free MCP and CLI tests
        run: cargo test --locked --no-default-features --features mcp-headless

      - name: Build all executable interfaces
        run: cargo build --locked --all-features --bins

      - name: Regenerate independent scientific references
        run: python tests/reference/verify_references.py target/ci-reference-verification
